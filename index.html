<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shark’s Cup</title>
<link rel="icon" href="logo.jpg">
<meta property="og:image" content="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--abyss:#050b1a;--deep:#0a1d4a;--wave:#2f8cff;--gold:#ffc21a;--foam:#f2f7ff;--mute:#9db2d6;--line:#1c3170;--ok:#3ddc97}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--abyss);color:var(--foam);font:400 17px/1.6 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;line-height:1;margin:0}
h2{font-size:clamp(34px,6vw,52px);margin-bottom:22px}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;padding:8px 16px;background:rgba(5,11,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto}
nav img{width:38px;height:38px;border-radius:8px;margin-right:8px}
nav a{color:var(--foam);text-decoration:none;padding:8px 14px;border-radius:8px;white-space:nowrap;font-weight:600}
nav a:hover{background:var(--deep)}
.hero{position:relative;background:radial-gradient(ellipse at 75% 30%,#123a9c 0,var(--deep) 40%,var(--abyss) 80%);padding:56px 20px 130px;
 clip-path:polygon(0 0,100% 0,100% 88%,95% 100%,90% 90%,85% 100%,80% 90%,75% 100%,70% 90%,65% 100%,60% 90%,55% 100%,50% 90%,45% 100%,40% 90%,35% 100%,30% 90%,25% 100%,20% 90%,15% 100%,10% 90%,5% 100%,0 90%)}
.wrap{max-width:1040px;margin:0 auto}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(64px,13vw,132px);letter-spacing:-1px;text-shadow:4px 4px 0 var(--deep)}
.hero h1 span{color:var(--gold)}
.hero p{font-size:22px;color:var(--mute);margin:14px 0 26px}
.hero img{width:100%;max-width:440px;justify-self:center;border-radius:28px;box-shadow:0 0 0 3px var(--gold),0 0 80px rgba(47,140,255,.55)}
.btn{display:inline-block;background:var(--gold);color:#1a1300;font:800 20px "Barlow Condensed",Impact,sans-serif;font-style:italic;padding:14px 30px;border-radius:10px;border:0;text-decoration:none;cursor:pointer;transform:skewX(-8deg)}
.btn:hover{background:#ffd54d}
.facts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.facts div{border-left:3px solid var(--gold);padding:2px 14px}
.facts b{display:block;font-size:20px}
.facts small{color:var(--mute)}
section{padding:60px 20px}
section:nth-of-type(even){background:linear-gradient(var(--deep),var(--abyss))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px}
form{display:grid;gap:14px;background:var(--deep);border:1px solid var(--line);padding:24px;border-radius:14px}
label{font-weight:600;display:grid;gap:6px}
input{font:inherit;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--abyss);color:var(--foam)}
.note{color:var(--mute)}
.err{color:#ff8a8a;min-height:1.4em;margin:0}
.fee{font:800 56px/1 "Barlow Condensed",Impact,sans-serif;font-style:italic;color:var(--gold)}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.plist li{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;gap:8px}
.paid{color:var(--ok)}.wait{color:var(--mute);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tabs button{font:600 16px Barlow,sans-serif;color:var(--foam);background:var(--deep);border:1px solid var(--line);padding:9px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.stage h3{font-size:30px;color:var(--wave);margin:26px 0 12px}
.bracket{display:flex;gap:30px;overflow-x:auto;padding-bottom:14px}
.col{display:grid;gap:16px;align-content:space-around;min-width:210px}
.col h4{margin:0;color:var(--gold);font-weight:600}
.m{background:var(--deep);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.m>div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px}
.m>div+div{border-top:1px solid var(--line)}
.m .w{background:#12348a;font-weight:600}.m .w b{color:var(--gold)}
.m small{display:block;padding:4px 12px;background:var(--abyss);color:var(--mute)}
.sc{overflow-x:auto;margin-bottom:16px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mute);font-weight:600}
tbody tr:first-child td:first-child{box-shadow:inset 3px 0 var(--gold)}
td:last-child{font-weight:600;color:var(--gold)}
.fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fx h4{grid-column:1/-1;margin:8px 0 0;color:var(--gold);font-weight:600}
ol.rules{padding-left:22px;max-width:70ch}ol.rules li{margin-bottom:10px}
footer{padding:36px 20px;text-align:center;color:var(--mute)}
@media(max-width:760px){.hero .wrap,.two{grid-template-columns:1fr}.hero img{order:-1;max-width:300px}}
@media(prefers-reduced-motion:no-preference){.hero img{animation:rise .9s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}}
</style>
</head>
<body>
<nav id="nav"></nav>
<header class="hero"><div class="wrap">
  <div>
    <h1 id="title"></h1>
    <p id="tag"></p>
    <a class="btn" id="cta" href="#register">Register now</a>
    <div class="facts" id="facts"></div>
  </div>
  <img src="logo.jpg" alt="Shark’s Cup logo: a shark behind a gold trophy">
</div></header>

<section id="register"><div class="wrap two">
  <div>
    <h2>Join the Cup</h2>
    <div class="fee" id="fee"></div>
    <p id="pay"></p>
    <p class="note" id="spots"></p>
  </div>
  <form id="form" novalidate>
    <label>Your username<input id="user" autocomplete="off" required maxlength="30" placeholder="The name you play with"></label>
    <label>Your WhatsApp number<input id="phone" inputmode="tel" required placeholder="e.g. 231 77 000 0000"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit">Send registration on WhatsApp</button>
    <p class="note">This opens WhatsApp with your details filled in. Send the message, then pay the entry fee.</p>
  </form>
</div></section>

<section id="players"><div class="wrap"><h2>Players</h2><ul class="plist" id="plist"></ul></div></section>
<section id="bracket"><div class="wrap"><h2>Fixtures and results</h2><div class="tabs" id="tabs"></div><div id="stage"></div></div></section>
<section id="rules"><div class="wrap"><h2>Rules</h2><ol class="rules" id="rulelist"></ol></div></section>
<footer><span id="foot"></span></footer>

<script src="config.js"></script>
<script>
const C=window.CUP,$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=Number.isFinite,done=m=>num(m.sa)&&num(m.sb);
const wa=C.whatsapp.replace(/\D/g,"");

/* Header, facts, nav */
document.title=C.name+" · "+C.tagline;
$("#title").innerHTML=esc(C.name).replace(/(\S+)$/,"<span>$1</span>");
$("#tag").textContent=C.tagline;
$("#facts").innerHTML=[["Game",C.game],["When",C.date],["Where",C.venue],["Entry",C.entryFee],["Prize",C.prize]]
  .filter(f=>f[1]).map(f=>`<div><b>${esc(f[1])}</b><small>${f[0]}</small></div>`).join("");
$("#nav").innerHTML='<img src="logo.jpg" alt="">'+[["register","Register"],["players","Players"],["bracket","Fixtures"],["rules","Rules"]]
  .map(l=>`<a href="#${l[0]}">${l[1]}</a>`).join("");
$("#fee").textContent=C.entryFee;
$("#pay").textContent=C.paymentInfo;
$("#rulelist").innerHTML=C.rules.map(r=>`<li>${esc(r)}</li>`).join("");
$("#foot").textContent="© "+new Date().getFullYear()+" "+C.name;

/* Players */
const taken=C.players.length;
$("#plist").innerHTML=C.players.length?C.players.map(p=>`<li><span>${esc(p.name)}</span><span class="${p.paid?"paid":"wait"}">${p.paid?"✓ Confirmed":"Awaiting payment"}</span></li>`).join(""):'<li class="note">No players yet. Be the first to register.</li>';
$("#spots").textContent=C.maxPlayers?`${Math.max(C.maxPlayers-taken,0)} of ${C.maxPlayers} spots left.`:"";

/* Registration → WhatsApp */
if(!C.registrationOpen){$("#form").innerHTML="<h3>Registration is closed</h3><p class='note'>Follow the fixtures below.</p>";$("#cta").style.display="none"}
$("#form").addEventListener("submit",e=>{
  e.preventDefault();
  const u=$("#user").value.trim(),p=$("#phone").value.trim(),err=$("#err");
  if(u.length<2){err.textContent="Enter your username (at least 2 characters).";return}
  if(p.replace(/\D/g,"").length<7){err.textContent="Enter a valid WhatsApp number.";return}
  if(C.players.some(x=>x.name.toLowerCase()===u.toLowerCase())){err.textContent="That username is already registered. Pick another.";return}
  err.textContent="";
  const msg=`${C.name} registration\nUsername: ${u}\nMy WhatsApp: ${p}\nEntry fee: ${C.entryFee}\nI am sending my payment now.`;
  window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
});

/* Competition rendering */
const card=m=>{const d=done(m),A=d&&m.sa>m.sb,B=d&&m.sb>m.sa;
  return `<div class="m"><div class="${A?"w":""}"><span>${esc(m.a||"To be decided")}</span><b>${d?m.sa:""}</b></div><div class="${B?"w":""}"><span>${esc(m.b||"To be decided")}</span><b>${d?m.sb:""}</b></div>${m.when?`<small>${esc(m.when)}</small>`:""}</div>`};

function standings(ms,players=[]){
  const t={},g=n=>t[n]||(t[n]={n,p:0,w:0,d:0,l:0,gf:0,ga:0});
  players.forEach(g);
  ms.forEach(m=>{if(!m.a||!m.b)return;const A=g(m.a),B=g(m.b);if(!done(m))return;
    A.p++;B.p++;A.gf+=m.sa;A.ga+=m.sb;B.gf+=m.sb;B.ga+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++}else if(m.sb>m.sa){B.w++;A.l++}else{A.d++;B.d++}});
  const P=C.points||{},rows=Object.values(t).map(x=>({...x,gd:x.gf-x.ga,pts:x.w*(P.win??3)+x.d*(P.draw??1)+x.l*(P.loss??0)}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.n.localeCompare(b.n));
  return `<div class="sc"><table><thead><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>`+
    rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?"+":""}${r.gd}</td><td>${r.pts}</td></tr>`).join("")+`</tbody></table></div>`;
}

function fixtures(ms){
  let out="",last;
  ms.forEach(m=>{if(m.round&&m.round!==last){out+=`<h4>${esc(m.round)}</h4>`;last=m.round}out+=card(m)});
  return `<div class="fx">${out}</div>`;
}

const league=(ms,pl)=>standings(ms,pl)+fixtures(ms);

function render(s){
  let h="";
  if(s.type==="bracket"){
    h=(s.sections||[{rounds:s.rounds||[]}]).map(sec=>(sec.title?`<h3>${esc(sec.title)}</h3>`:"")+
      `<div class="bracket">${sec.rounds.map(r=>`<div class="col"><h4>${esc(r.name)}</h4>${r.matches.map(card).join("")}</div>`).join("")}</div>`).join("");
  }else if(s.type==="groups"){
    h=s.groups.map(g=>`<h3>${esc(g.name)}</h3>`+league(g.matches,g.players)).join("");
  }else{
    h=league(s.matches||[],s.players);
  }
  $("#stage").innerHTML=`<div class="stage">${h}</div>`;
}

const tabs=$("#tabs");
if(!C.stages||!C.stages.length){$("#stage").innerHTML='<p class="note">Fixtures will appear here once the draw is made.</p>'}
else{
  tabs.innerHTML=C.stages.map((s,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===0}">${esc(s.name)}</button>`).join("");
  tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    tabs.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));render(C.stages[b.dataset.i])});
  render(C.stages[0]);
}
</script>
</body>
</html>
