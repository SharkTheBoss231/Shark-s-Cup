<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shark’s Cup · Admin</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--abyss:#050b1a;--deep:#0a1d4a;--wave:#2f8cff;--gold:#ffc21a;--foam:#f2f7ff;--mute:#9db2d6;--line:#1c3170;--ok:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:var(--abyss);color:var(--foam);font:400 16px/1.5 Barlow,system-ui,sans-serif;padding:20px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;margin:0;line-height:1}
h1{font-size:46px}h1 span{color:var(--gold)}h2{font-size:30px;color:var(--wave);margin-bottom:12px}
.card{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:20px}
input,select{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--abyss);color:var(--foam);max-width:100%}
input[type=number]{width:70px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
button{font:600 15px Barlow,sans-serif;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--abyss);color:var(--foam);cursor:pointer}
button.go{background:var(--gold);color:#1a1300;border-color:var(--gold)}
button.x{color:#ff8a8a}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row>b,.row>.g{flex:1;min-width:110px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:grid;gap:4px;color:var(--mute);font-size:14px}
.ok{color:var(--ok)}.mute{color:var(--mute)}.bad{color:#ff8a8a}
#msg{position:sticky;bottom:10px;background:var(--abyss);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Shark’s Cup <span>Admin</span></h1>
  <div id="app"></div>
  <div id="msg" role="status">Fill in the GitHub settings, then press Load.</div>
</div>
<script src="config.js"></script>
<script src="generator.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const K="sharkscup-admin";
const store={get(){try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return{}}},set(v){try{localStorage.setItem(K,JSON.stringify(v))}catch(e){}}};
const cfg=Object.assign({owner:"",repo:"",branch:"main",path:"data.json",token:""},store.get());
const S={players:[],live:false,stage:{type:"auto",format:"single_elim",players:"paid",seed:"sharks-cup",shuffle:true,groups:2,advance:2,legs:1,thirdPlace:false,rounds:0,results:[]}};
let sha=null;
const msg=(t,bad)=>{const m=$("#msg");m.textContent=t;m.className=bad?"bad":""};
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));

const gh=(method,body)=>fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`+(method==="GET"?`?ref=${cfg.branch}&t=${Date.now()}`:""),
  {method,headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"},body:body&&JSON.stringify(body)});

async function load(){
  if(!cfg.owner||!cfg.repo||!cfg.token){msg("Enter your GitHub username, repository and token first.",1);return}
  try{const r=await gh("GET");
    if(r.status===404){sha=null;msg("No data file yet. It will be created when you publish.");return}
    if(!r.ok){msg("GitHub replied "+r.status+". Check the username, repository, branch and token.",1);return}
    const j=await r.json(),D=JSON.parse(dec(j.content));sha=j.sha;
    S.players=D.players||[];const g=(D.stages||[])[0];if(g){S.stage=Object.assign(S.stage,g);S.live=true}
    msg("Loaded "+S.players.length+" players.");render()}
  catch(e){msg("Could not load: "+e.message,1)}}

async function save(){
  const body={message:"Update Shark’s Cup",branch:cfg.branch,
    content:enc(JSON.stringify({players:S.players,stages:S.live?[S.stage]:[]},null,2))};
  if(sha)body.sha=sha;
  try{const r=await gh("PUT",body);
    if(!r.ok){msg(r.status===409||r.status===422?"The file changed on GitHub. Press Load, then redo your last change.":"GitHub replied "+r.status+". Check that the token has Contents: Read and write.",1);return}
    sha=(await r.json()).content.sha;msg("Published. The live site updates in about a minute.")}
  catch(e){msg("Could not publish: "+e.message,1)}}

function pending(){
  window.CUP.players=S.players;
  const names=new Set(S.players.map(p=>p.name)),out=[];
  expandAuto(S.stage).forEach(s=>{
    const ko=s.type==="bracket",add=(m,l)=>{if(m.bye||!names.has(m.a)||!names.has(m.b)||Number.isFinite(m.sa))return;out.push({m,ko,l:s.name+(l?" · "+l:"")})};
    if(ko)s.sections.forEach(x=>x.rounds.forEach(r=>r.matches.forEach(m=>add(m,r.name))));
    else if(s.type==="groups")s.groups.forEach(g=>g.matches.forEach(m=>add(m,g.name+(m.round?" · "+m.round:""))));
    else s.matches.forEach(m=>add(m,m.round))});
  return out}

function render(){
  const g=S.stage,f=g.format,paid=S.players.filter(p=>p.paid).length,P=pending();
  const fld=(k,l,t="text")=>`<label>${l}<input data-f="${k}" type="${t}" value="${esc(g[k])}"></label>`;
  $("#app").innerHTML=`
  <div class="card"><h2>1. GitHub connection</h2><div class="grid">
    ${["owner:GitHub username","repo:Repository name","branch:Branch","path:Data file path","token:Access token"].map(x=>{const[k,l]=x.split(":");return `<label>${l}<input data-c="${k}" type="${k==="token"?"password":"text"}" value="${esc(cfg[k])}" autocomplete="off"></label>`}).join("")}
  </div><p><button class="go" data-act="load">Load from GitHub</button></p></div>

  <div class="card"><h2>2. Players <span class="mute">(${paid} confirmed of ${S.players.length})</span></h2>
    ${S.players.map((p,i)=>`<div class="row"><b>${esc(p.name)}</b>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-p="${i}" ${p.paid?"checked":""}><span class="${p.paid?"ok":"mute"}">${p.paid?"Payment confirmed":"Awaiting payment"}</span></label>
      <button class="x" data-act="del" data-i="${i}">Remove</button></div>`).join("")||'<p class="mute">No players yet.</p>'}
    <p><input id="np" placeholder="Add a username" maxlength="30"> <button data-act="add">Add player</button></p></div>

  <div class="card"><h2>3. Tournament setup</h2><div class="grid">
    <label>Format<select data-f="format">${[["single_elim","Single elimination"],["double_elim","Double elimination"],["round_robin","Round robin (league)"],["swiss","Swiss"],["groups_knockout","Groups + knockout"]].map(o=>`<option value="${o[0]}" ${f===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label>
    <label>Who plays<select data-f="players"><option value="paid" ${g.players==="paid"?"selected":""}>Confirmed players only</option><option value="all" ${g.players==="all"?"selected":""}>All players</option></select></label>
    ${fld("seed","Draw seed (change it to redraw)")}
    <label>Random draw<select data-f="shuffle"><option value="true" ${g.shuffle!==false?"selected":""}>Shuffle players</option><option value="false" ${g.shuffle===false?"selected":""}>Keep list order</option></select></label>
    ${f==="groups_knockout"?fld("groups","Number of groups","number")+fld("advance","Players advancing per group","number"):""}
    ${f==="round_robin"||f==="groups_knockout"?`<label>Legs<select data-f="legs"><option value="1" ${g.legs!=2?"selected":""}>Single</option><option value="2" ${g.legs==2?"selected":""}>Home and away</option></select></label>`:""}
    ${f==="swiss"?fld("rounds","Rounds (0 = automatic)","number"):""}
    ${f==="single_elim"||f==="groups_knockout"?`<label>Third-place match<select data-f="thirdPlace"><option value="false" ${!g.thirdPlace?"selected":""}>No</option><option value="true" ${g.thirdPlace?"selected":""}>Yes</option></select></label>`:""}
  </div>
  <p><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-live ${S.live?"checked":""}> <span>Show the fixtures on the live site (make the draw public)</span></label></p>
  <p class="mute">Set this up before the first match. Changing the seed or players later redraws the fixtures.</p></div>

  <div class="card"><h2>4. Enter results</h2>
    ${P.map((x,i)=>`<div class="row" data-i="${i}"><span class="mute" style="flex-basis:100%">${esc(x.l)}</span><b>${esc(x.m.a)}</b>
      <input type="number" min="0" data-s="a"> <span>–</span> <input type="number" min="0" data-s="b"> <b>${esc(x.m.b)}</b>
      ${x.ko?`<select data-s="w"><option value="">Winner if drawn</option><option>${esc(x.m.a)}</option><option>${esc(x.m.b)}</option></select>`:""}
      <button class="go" data-act="res" data-i="${i}">Save</button></div>`).join("")||'<p class="mute">No matches waiting for a result. Add confirmed players first.</p>'}
    <h2 style="margin-top:22px;font-size:22px">Saved results</h2>
    ${(g.results||[]).map((r,i)=>`<div class="row"><b>${esc(r.a)} ${r.sa} – ${r.sb} ${esc(r.b)}${r.w?` <span class="mute">(${esc(r.w)} won)</span>`:""}</b><button class="x" data-act="delres" data-i="${i}">Delete</button></div>`).join("")||'<p class="mute">None yet.</p>'}</div>

  <div class="card"><h2>5. Publish</h2><p>Nothing is public until you press this.</p>
    <button class="go" data-act="save">Publish to the live site</button>
    <button data-act="dl">Download data.json instead</button></div>`}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
  if(a==="load")load();
  else if(a==="save")save();
  else if(a==="dl"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify({players:S.players,stages:S.live?[S.stage]:[]},null,2)],{type:"application/json"}));l.download="data.json";l.click()}
  else if(a==="add"){const n=$("#np").value.trim();
    if(n.length<2)return msg("Enter a username.",1);
    if(S.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return msg("That username is already in the list.",1);
    S.players.push({name:n,paid:false});render()}
  else if(a==="del"){if(confirm("Remove "+S.players[i].name+"?")){S.players.splice(i,1);render()}}
  else if(a==="delres"){S.stage.results.splice(i,1);render()}
  else if(a==="res"){const row=b.closest(".row"),m=pending()[i].m,q=k=>row.querySelector(`[data-s=${k}]`);
    const sa=q("a").value,sb=q("b").value;
    if(sa===""||sb==="")return msg("Enter both scores.",1);
    const r={a:m.a,b:m.b,sa:+sa,sb:+sb},w=q("w")&&q("w").value;
    if(+sa===+sb&&q("w")&&!w)return msg("Knockout match is level. Pick the winner.",1);
    if(w&&+sa===+sb)r.w=w;
    S.stage.results.push(r);msg("Result saved. Press Publish when ready.");render()}});

document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.c){cfg[d.c]=t.value.trim();store.set(cfg)}
  else if(d.p!==undefined){S.players[+d.p].paid=t.checked;render()}
  else if(d.live!==undefined){S.live=t.checked;render()}
  else if(d.f){let v=t.value;
    if(["groups","advance","legs","rounds"].includes(d.f))v=+v;
    if(["shuffle","thirdPlace"].includes(d.f))v=v==="true";
    S.stage[d.f]=v;render()}});
render();
</script>
</body>
</html>
